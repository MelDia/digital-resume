<div
  id="notepad"
  class="notepad"
  cdkDrag
  cdkDragRootElement=".cdk-overlay-pane"
  [ngStyle]="style"
  mwlResizable
  [validateResize]="resizeService.validate"
  [enableGhostResize]="true"
  [resizeSnapGrid]="{ left: 1, right: 1 }"
  (resizeEnd)="onResizeEnd($event)"
>
  <!--   [ngStyle]="{
    left: this.appInstance.position.left,
    top: this.appInstance.position.top,
    width: this.appInstance.size.width,
    height: this.appInstance.size.height,
    transform: this.appInstance.isMaximized
      ? 'translate3d(0px, 30px, 0px)'
      : 'none'
  }" -->
  <div class="notepad-container">
    <div class="notepad-header" cdkDragHandle>
      <div class="notepad-title">Notepad</div>
      <div class="notepad-controls">
        <button class="notepad-minimize" (click)="toggleMinimizeNotepad()">
          <div class="icon-minimize"></div>
        </button>
        <button
          *ngIf="!isMaximized"
          class="notepad-maximize"
          (click)="toggleMaximizeNotepad()"
        >
          <div class="icon-maximize"></div>
        </button>
        <button
          *ngIf="isMaximized"
          class="notepad-restore-maximize"
          (click)="toggleRestoreMaximizeNotepad()"
        >
          L
        </button>
        <button class="notepad-close" (click)="toggleCloseNotepad()">
          <div class="icon-close"></div>
        </button>
      </div>
    </div>
    <div class="notepad-content">
      <div class="notepad-text">Hello World!</div>
      <div class="notepad-text">Hello World!</div>
      <div class="notepad-text">Hello World!</div>
    </div>
  </div>

  <div
    class="resize-handle-top"
    mwlResizeHandle
    [resizeEdges]="{ top: true }"
  ></div>
  <div
    class="resize-handle-left"
    mwlResizeHandle
    [resizeEdges]="{ left: true }"
  ></div>
  <div
    class="resize-handle-right"
    mwlResizeHandle
    [resizeEdges]="{ right: true }"
  ></div>
  <div
    class="resize-handle-bottom"
    mwlResizeHandle
    [resizeEdges]="{ bottom: true }"
  ></div>
</div>
